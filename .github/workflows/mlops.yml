name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chạy unit tests trên dữ liệu ảo (không cần kết nối cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xác thực cloud storage, pull dữ liệu bằng DVC, huấn luyện mô hình, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          cp /tmp/sa-key.json sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV


      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          
          # Upload model
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print(f"Model uploaded successfully to gs://{bucket_name}/models/latest/model.pkl")

          # Upload metrics for rollback check (Bonus 4)
          blob_metrics = bucket.blob("models/latest/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print(f"Metrics uploaded successfully to gs://{bucket_name}/models/latest/metrics.json")
          EOF

      - name: Save metrics and reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-and-report
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiểm tra ngưỡng chất lượng (accuracy >= 0.70 hoặc eval gate) & Bonus 4
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install google-cloud-storage
      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
      - name: Check eval gate and rollback safety (Bonus 4)
        run: |
          python - <<'EOF'
          import os, json
          from google.cloud import storage

          current_acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy hien tai cua model moi: {current_acc:.4f}")

          # Nguong danh gia toi thieu cho deploy (chuan rubric 0.70)
          EVAL_THRESHOLD = 0.70
          if current_acc < EVAL_THRESHOLD:
              raise SystemExit(f"FAILED: accuracy {current_acc:.4f} < {EVAL_THRESHOLD}. Huy deploy.")
          print(f"PASSED: Accuracy dat nguong danh gia ({current_acc:.4f} >= {EVAL_THRESHOLD}).")


          # Bonus 4: Kiem tra so voi model truoc do tren GCS (neu co)
          try:
              bucket_name = "${{ secrets.CLOUD_BUCKET }}"
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("models/latest/metrics.json")
              if blob.exists():
                  blob.download_to_filename("/tmp/prev_metrics.json")
                  with open("/tmp/prev_metrics.json") as f:
                      prev_metrics = json.load(f)
                  prev_acc = float(prev_metrics.get("accuracy", 0.0))
                  print(f"[BONUS 4] So sanh accuracy: Model cu = {prev_acc:.4f} vs Model moi = {current_acc:.4f}")
          except Exception as e:
              print(f"Khong the doc metric cu: {e}")

          print("PASSED: Du dieu kien trien khai len Cloud VM.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Triển khai lên VM qua SSH.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            for i in {1..5}; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Dang cho server khoi dong... ($i/5)"
              sleep 3
            done
            echo "Health check that bai!"
            exit 1

